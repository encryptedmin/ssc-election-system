<header class="h-20 border-b border-slate-800 bg-slate-900 flex items-center justify-between px-8">

    <div>

        <h2 class="text-2xl font-bold tracking-tight">

            {% block page_title %}
            Dashboard
            {% endblock %}

        </h2>

    </div>

    <div class="flex items-center gap-4">

        <div class="text-right">

            <p class="font-medium">
                {{ request.user.username }}
            </p>

            <p class="text-sm text-slate-400">
                Administrator
            </p>

        </div>

        <div class="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center font-bold">

            {{ request.user.username|first|upper }}

        </div>

    </div>

</header>
