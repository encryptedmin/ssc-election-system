{% extends 'layouts/admin_base.html' %}

{% block title %}
Add Candidate
{% endblock %}

{% block page_title %}
Add Candidate
{% endblock %}

{% block content %}

<div class="max-w-3xl">

    <div class="mb-8">

        <h2 class="text-3xl font-bold">
            Add Candidate
        </h2>

        <p class="text-slate-400 mt-2">
            {{ position.name }}
        </p>

    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">

        <form
            method="POST"
            enctype="multipart/form-data"
            class="space-y-6"
        >

            {% csrf_token %}

            <div>

                <label class="block mb-2 text-sm text-slate-300">
                    Full Name
                </label>

                {{ form.fullname }}

            </div>

            <div>

                <label class="block mb-2 text-sm text-slate-300">
                    Candidate Photo
                </label>

                {{ form.photo }}

            </div>

            <div>

                <label class="block mb-2 text-sm text-slate-300">
                    Platform
                </label>

                {{ form.platform }}

            </div>

            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 transition px-6 py-3 rounded-2xl font-medium"
            >

                Create Candidate

            </button>

        </form>

    </div>

</div>

{% endblock %}
