{% extends 'layouts/admin_base.html' %}

{% block title %}
Edit Voter
{% endblock %}

{% block page_title %}
Edit Voter
{% endblock %}

{% block content %}

<div class="max-w-3xl">

    <div class="mb-8">

        <h2 class="text-3xl font-bold">
            Edit Voter
        </h2>

        <p class="text-slate-400 mt-2">
            Update voter information
        </p>

    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            <div>

                <label class="block mb-2 text-sm text-slate-300">
                    Student ID
                </label>

                <input
                    type="text"
                    name="student_id"
                    value="{{ voter.student_id }}"
                    class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-blue-500"
                >

            </div>

            <div>

                <label class="block mb-2 text-sm text-slate-300">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    value="{{ voter.username }}"
                    class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-blue-500"
                >

            </div>

            <div>

                <label class="block mb-2 text-sm text-slate-300">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ voter.email }}"
                    class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-blue-500"
                >

            </div>

            <div class="grid md:grid-cols-2 gap-6">

                <div>

                    <label class="block mb-2 text-sm text-slate-300">
                        Department
                    </label>

                    <input
                        type="text"
                        name="department"
                        value="{{ voter.department }}"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-blue-500"
                    >

                </div>

                <div>

                    <label class="block mb-2 text-sm text-slate-300">
                        Year Level
                    </label>

                    <input
                        type="text"
                        name="year_level"
                        value="{{ voter.year_level }}"
                        class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-blue-500"
                    >

                </div>

            </div>

            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 transition px-6 py-3 rounded-2xl font-medium"
            >

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
