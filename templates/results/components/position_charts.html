<section>
    <h3 class="text-xl font-bold">Per-Position Charts</h3>
    <p class="text-sm text-slate-400 mt-1 mb-4">
        Candidate totals for every position
    </p>

    <div class="grid gap-6 xl:grid-cols-2">

        {% for position in results.positions %}

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h4 class="text-lg font-bold">{{ position.name }}</h4>
            <p class="text-sm text-slate-400 mt-1 mb-4">
                <span data-position-chart-total="{{ position.id }}">{{ position.total_votes }}</span>
                total votes
            </p>
            <div class="h-80">
                <canvas data-position-chart="{{ position.id }}"></canvas>
            </div>
        </div>

        {% empty %}

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-slate-400">
            No per-position charts are available yet.
        </div>

        {% endfor %}

    </div>
</section>
